name: verify

on: [push, pull_request]

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Run the 16 acceptance checks
        run: python3 gov/verify.py
      - name: Smoke-test the live console API
        run: python3 gov/console_smoke.py
      - name: Run the Age of Empires MVP acceptance checks
        run: python3 gov/verify_sim.py
      - name: Run the Workspace (real work) acceptance checks
        run: python3 gov/verify_work.py
      - name: Run the Builder (autonomous development) acceptance checks
        run: |
          git config --global user.email "ci@phoenix.local"
          git config --global user.name "Phoenix CI"
          python3 gov/verify_builder.py
