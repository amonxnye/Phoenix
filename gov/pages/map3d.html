</head><body>
<div id="vig"></div>
<div id="hud">
  <div class="t">PHOENIX</div>
  <div class="d" id="age">— · turn —</div>
  <div style="height:6px"></div>
  <div class="r"><span><i class="dot" style="background:#e05a5a"></i>food</span><span id="vfood">—</span></div>
  <div class="r"><span><i class="dot" style="background:#b5793a"></i>wood</span><span id="vwood">—</span></div>

</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

/* ── palette ─────────────────────────────────────────────────────────── */
const PAL = {bg:0x120d08, ink:0xf0e6d2, dim:0xb09a72,
             food:0xe05a5a, wood:0xb5793a, gold:0xe0b23a, green:0xa8e086, blue:0x8ab4ff};
const RES_HEX = {food:0xe05a5a, wood:0xb5793a, gold:0xe0b23a};

/* entity-seeded PRNG (arnis pattern) — same world renders identically every run */
const srand = seed => {let a=(seed*2654435761)>>>0; return ()=>{a|=0;a=(a+0x6D2B79F5)|0;
  let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296;}};
const thash=(x,y)=>{let h=((x*374761393+y*668265263)^(x*y*2246822519+1))>>>0;
  h=Math.imul(h^(h>>>13),1274126177)>>>0; return ((h^(h>>>16))>>>0)/4294967296;};
const shade=(hex,f)=>new THREE.Color(hex).multiplyScalar(f);
const weather=(c,cond)=>{ // condition<100 → desaturate + darken toward dust
  const g=(c.r+c.g+c.b)/3, k=cond/100, m=0.35+0.65*k;
  return new THREE.Color(c.r*k+g*(1-k),c.g*k+g*(1-k),c.b*k+g*(1-k)).multiplyScalar(m);};

/* ── renderer / scene / camera ───────────────────────────────────────── */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x351c0b, 30, 95);

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 300);
camera.position.set(8.4, 5.6, 12.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.9, 0.5, -1.0);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI*0.49; controls.minDistance = 3; controls.maxDistance = 55;

/* ── golden-hour sky dome ────────────────────────────────────────────── */
const sunDir = new THREE.Vector3(-0.62, 0.30, 0.22).normalize();
const sky = new THREE.Mesh(new THREE.SphereGeometry(120, 32, 18),
  new THREE.ShaderMaterial({side:THREE.BackSide, depthWrite:false, fog:false,
    uniforms:{sunDir:{value:sunDir}},
    vertexShader:`varying vec3 vD; void main(){ vD=normalize(position);
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`varying vec3 vD; uniform vec3 sunDir;
      void main(){
        float h = clamp(vD.y, -0.2, 1.0);
        vec3 top  = vec3(0.055,0.035,0.022);              /* deep brown-black */
        vec3 emb  = vec3(0.86,0.46,0.14);                  /* ember gold horizon */
        vec3 low  = vec3(0.07,0.045,0.028);
        vec3 col = mix(emb, top, smoothstep(0.02, 0.5, h));
        col = mix(low, col, smoothstep(-0.2, 0.02, h));
        float s = max(dot(vD, sunDir), 0.0);
        col += vec3(1.0,0.62,0.25)*pow(s, 26.0)*0.9;       /* sun halo */
        col += vec3(0.9,0.5,0.18)*pow(s, 5.0)*0.22;        /* broad warm wash */
        gl_FragColor = vec4(col, 1.0);
      }`}));
scene.add(sky);

/* visible sun disc */
const sunCv = document.createElement('canvas'); sunCv.width=sunCv.height=128;
{ const g=sunCv.getContext('2d'), gr=g.createRadialGradient(64,64,4,64,64,62);
  gr.addColorStop(0,'rgba(255,235,190,1)'); gr.addColorStop(0.25,'rgba(255,190,90,0.9)');
  gr.addColorStop(0.6,'rgba(255,140,50,0.28)'); gr.addColorStop(1,'rgba(255,120,40,0)');
  g.fillStyle=gr; g.fillRect(0,0,128,128); }
const sunSpr = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(sunCv),
  blending:THREE.AdditiveBlending, depthWrite:false, fog:false, transparent:true}));
sunSpr.position.copy(sunDir).multiplyScalar(105); sunSpr.scale.setScalar(30);
scene.add(sunSpr);

/* ── lights ──────────────────────────────────────────────────────────── */
scene.add(new THREE.HemisphereLight(0x96602c, 0x241608, 1.4));
const sun = new THREE.DirectionalLight(0xffc27a, 3.4);
sun.position.copy(sunDir).multiplyScalar(34);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera, {left:-17, right:17, top:14, bottom:-14, near:2, far:80});
sun.shadow.bias = -0.0006;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x8ab4ff, 0.35);   // cool dusk fill
fill.position.set(14, 8, -10); scene.add(fill);

/* ── shared geometry / materials ─────────────────────────────────────── */
const G = {
  box: new THREE.BoxGeometry(1,1,1),
  cone4: new THREE.ConeGeometry(0.72, 1, 4),
  cone8: new THREE.ConeGeometry(0.5, 1, 8),
  cyl: new THREE.CylinderGeometry(0.5,0.5,1,8),
  ico: new THREE.IcosahedronGeometry(0.5,0),
  oct: new THREE.OctahedronGeometry(0.5,0),
  sph: new THREE.SphereGeometry(0.5,10,8),
  cap: new THREE.CapsuleGeometry(0.5,0.7,3,8),
};
const mat = (c,o={})=>new THREE.MeshStandardMaterial({color:c, roughness:0.85, metalness:0.05,
  flatShading:true, ...o});

/* grid mapping — 24x16 tiles, 1u/tile, centred on origin */
let MW=24, MH=16;
const wx = x => x - MW/2 + 0.5;
const wz = y => y - MH/2 + 0.5;
const tileTop = (x,y) => 0.02 + thash(x,y)*0.11;

/* ── diorama base slab + voxel tile field ────────────────────────────── */
const world = new THREE.Group(); scene.add(world);
let tilesIM = null;
function buildTiles(terr){
  if (tilesIM) { world.remove(tilesIM); tilesIM.dispose(); }
  const cls = {}; for (const t of terr) cls[t.x+','+t.y] = t.cls;
  const geo = new THREE.BoxGeometry(1,1,1); geo.translate(0,-0.5,0);
  tilesIM = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({roughness:0.95, metalness:0}), MW*MH);
  const m4 = new THREE.Matrix4(), col = new THREE.Color();
  let i=0;
  for (let y=0;y<MH;y++) for (let x=0;x<MW;x++){
    const h = thash(x,y), top = tileTop(x,y), c = cls[x+','+y];
    const s = (c==='water') ? -0.22 : 0;
    m4.makeTranslation(wx(x), top+s, wz(y));
    m4.multiply(new THREE.Matrix4().makeScale(0.985, 0.65+top, 0.985));
    tilesIM.setMatrixAt(i, m4);
    // warm earthen ground with per-tile variation; class-tinted underfoot
    col.setHex(0x402c14).lerp(new THREE.Color(0x5c3f1e), h);
    if (c==='forest')    col.lerp(new THREE.Color(0x33481a), 0.5);
    if (c==='berries')   col.lerp(new THREE.Color(0x54401e), 0.5).lerp(new THREE.Color(0x635024),0.3);
    if (c==='gold_seam') col.lerp(new THREE.Color(0x6b4c1a), 0.55);
    if (c==='water')     col.setHex(0x26425e);
    tilesIM.setColorAt(i, col);
    i++;
  }
  tilesIM.receiveShadow = true; tilesIM.castShadow = false;
  world.add(tilesIM);
}
{ // slab the diorama sits on
  const slab = new THREE.Mesh(G.box, mat(0x2a1b0d, {flatShading:false}));
  slab.scale.set(MW+0.9, 1.6, MH+0.9); slab.position.y = -1.15;
  slab.receiveShadow = true; world.add(slab);
  const rim = new THREE.Mesh(G.box, mat(0x3a2c18,{flatShading:false}));
  rim.scale.set(MW+1.15, 0.12, MH+1.15); rim.position.y = -0.36; world.add(rim);
}

/* ── scatter detail: pebbles + grass tufts on the empty plains ───────── */
function buildScatter(terr, placements, town){
  const busy=new Set([town[0]+','+town[1]]);
  for (const t of terr) busy.add(t.x+','+t.y);
  for (const p of placements) busy.add(p.x+','+p.y);
  const tufts=[], rocks=[];
  for (let y=0;y<MH;y++) for (let x=0;x<MW;x++){
    if (busy.has(x+','+y)) continue;
    const h=thash(x,y), rnd=srand(x*977+y*131+3), top=tileTop(x,y);
    if (h>0.38){                                      // grass tufts
      const n=1+(h*3|0);
      for (let i=0;i<n;i++)
        tufts.push([wx(x)+(rnd()-0.5)*0.7, top, wz(y)+(rnd()-0.5)*0.7,
                    0.5+rnd()*0.8, rnd()*Math.PI]);
    }
    if (h<0.14) rocks.push([wx(x)+(rnd()-0.5)*0.5, top, wz(y)+(rnd()-0.5)*0.5,
                            0.5+rnd()*0.9, rnd()*Math.PI]);
  }
  const d=new THREE.Object3D();
  const tim=new THREE.InstancedMesh(G.cone8,
    new THREE.MeshStandardMaterial({color:0x6e7c30,roughness:1,flatShading:true}), tufts.length);
  tufts.forEach((p,i)=>{ d.position.set(p[0],p[1]+0.055*p[3],p[2]);
    d.rotation.set(0,p[4],0); d.scale.set(0.11*p[3],0.14*p[3],0.11*p[3]); d.updateMatrix();
    tim.setMatrixAt(i,d.matrix); });
  tim.receiveShadow=true; world.add(tim);
  const rim2=new THREE.InstancedMesh(G.ico,
    new THREE.MeshStandardMaterial({color:0x5a4a38,roughness:1,flatShading:true}), rocks.length);
  rocks.forEach((p,i)=>{ d.position.set(p[0],p[1]+0.035*p[3],p[2]);
    d.rotation.set(p[4],p[4]*2,0); d.scale.set(0.11*p[3],0.075*p[3],0.11*p[3]); d.updateMatrix();
    rim2.setMatrixAt(i,d.matrix); });
  rim2.castShadow=rim2.receiveShadow=true; world.add(rim2);
}

/* ── animated pond ───────────────────────────────────────────────────── */
let water=null, waterBase=null;
function buildWater(terr){
  const tiles = terr.filter(t=>t.cls==='water');
  if (!tiles.length || water) return;
  const xs = tiles.map(t=>t.x), ys = tiles.map(t=>t.y);
  const cx=(Math.min(...xs)+Math.max(...xs))/2, cy=(Math.min(...ys)+Math.max(...ys))/2;
  const w=Math.max(...xs)-Math.min(...xs)+0.98, h=Math.max(...ys)-Math.min(...ys)+0.98;
  const geo = new THREE.PlaneGeometry(w, h, 18, 18); geo.rotateX(-Math.PI/2);
  water = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({color:0x35608f,
    specular:0xffd9a0, shininess:90, flatShading:true, emissive:0x1c3a5c,
    emissiveIntensity:0.5, transparent:true, opacity:0.96}));
  water.position.set(wx(cx), -0.045, wz(cy));
  water.receiveShadow = true;
  waterBase = Float32Array.from(geo.attributes.position.array);
  world.add(water);
}
function animWater(t){
  if (!water) return;
  const p = water.geometry.attributes.position;
  for (let i=0;i<p.count;i++){
    const x=waterBase[i*3], z=waterBase[i*3+2];
    p.array[i*3+1] = Math.sin(x*3.1+t*1.7)*0.035 + Math.cos(z*2.6+t*2.3+x)*0.03;
  }
  p.needsUpdate = true; water.geometry.computeVertexNormals();
}

/* ── vegetation (instanced, rebuilt on terrain change) ───────────────── */
const veg = {group:new THREE.Group(), sig:''};
world.add(veg.group);
function rebuildVeg(terr){
  const sig = terr.map(t=>t.cls+t.x+','+t.y+':'+t.stock).join('|');
  if (sig === veg.sig) return; veg.sig = sig;
  veg.group.clear(); veg.crystalIM = null;
  const put=[], dummy=new THREE.Object3D();
  const emit=(kind,x,y,z,s,ry,c)=>put.push({kind,x,y,z,s,ry,c});
  for (const t of terr){
    const h = thash(t.x,t.y), rnd = srand((t.x*131+t.y*7)+7), top = tileTop(t.x,t.y);
    const bx = wx(t.x), bz = wz(t.y), k = t.stock/100;
    if (t.cls==='forest'){
      const n = 1 + Math.floor(h*3);                      // 1–3 trees per tile
      for (let i=0;i<n;i++){
        const ox=(rnd()-0.5)*0.62, oz=(rnd()-0.5)*0.62, ry=rnd()*Math.PI;
        if (t.stock<=0){ emit('stump', bx+ox, top, bz+oz, 0.8+rnd()*0.3, ry); continue; }
        const s = (0.55+rnd()*0.5)*(0.45+0.55*k);
        emit('trunk',  bx+ox, top, bz+oz, s, ry);
        emit('canopy', bx+ox, top, bz+oz, s, ry, 0x4a6a24 + ((rnd()*3|0)*0x060c05));
      }
    } else if (t.cls==='berries'){
      if (t.stock<=0){ emit('stump', bx, top, bz, 0.6, 0); continue; }
      const n = 1 + (h>0.5?1:0);
      for (let i=0;i<n;i++){
        const ox=(rnd()-0.5)*0.5, oz=(rnd()-0.5)*0.5, s=(0.6+rnd()*0.4)*(0.5+0.5*k);
        emit('bush', bx+ox, top, bz+oz, s, rnd()*Math.PI);
        for (let d=0;d<4;d++) emit('berry', bx+ox+(rnd()-0.5)*0.26*s, top+0.14*s+rnd()*0.12*s,
                                   bz+oz+(rnd()-0.5)*0.26*s, s, 0);
      }
    } else if (t.cls==='gold_seam'){
      if (t.stock<=0){ emit('spent', bx, top, bz, 0.8+h*0.3, h*3); continue; }
      const n = 2 + Math.floor(h*2.5);
      for (let i=0;i<n;i++)
        emit('crystal', bx+(rnd()-0.5)*0.6, top, bz+(rnd()-0.5)*0.6,
             (0.5+rnd()*0.7)*(0.45+0.55*k), rnd()*Math.PI, 0);
    }
  }
  const groups={};
  for (const p of put) (groups[p.kind]=groups[p.kind]||[]).push(p);
  const spec = {
    trunk:  {geo:G.cyl, mat:mat(0x4a3218), sc:p=>[0.10*p.s,0.5*p.s,0.10*p.s], oy:p=>0.25*p.s, shadow:true},
    canopy: {geo:G.cone8, mat:mat(0x3f5c1e), sc:p=>[0.62*p.s,0.95*p.s,0.62*p.s], oy:p=>0.45*p.s+0.42*p.s, color:true, shadow:true},
    stump:  {geo:G.cyl, mat:mat(0x3a2a16), sc:p=>[0.09*p.s,0.1*p.s,0.09*p.s], oy:p=>0.05*p.s, shadow:false},
    bush:   {geo:G.ico, mat:mat(0x55702c), sc:p=>[0.5*p.s,0.42*p.s,0.5*p.s], oy:p=>0.19*p.s, shadow:true},
    berry:  {geo:G.sph, mat:mat(0xe05a5a,{emissive:0x701c1c,emissiveIntensity:0.55,flatShading:false}),
             sc:p=>[0.075,0.075,0.075], oy:p=>0.1, shadow:false},
    crystal:{geo:G.oct, mat:mat(0xe0b23a,{emissive:0xa87410,emissiveIntensity:0.75,metalness:0.65,roughness:0.3}),
             sc:p=>[0.24*p.s,0.44*p.s,0.24*p.s], oy:p=>0.2*p.s, shadow:true},
    spent:  {geo:G.ico, mat:mat(0x4a4238), sc:p=>[0.4*p.s,0.24*p.s,0.4*p.s], oy:p=>0.1*p.s, shadow:false},
  };
  for (const kind in groups){
    const s = spec[kind], list = groups[kind];
    const im = new THREE.InstancedMesh(s.geo, s.mat, list.length);
    list.forEach((p,i)=>{
      const sc=s.sc(p);
      dummy.position.set(p.x, p.y+s.oy(p), p.z);
      dummy.rotation.set(0,p.ry||0,kind==='crystal'?(p.ry*0.14-0.07):0);
      dummy.scale.set(sc[0],sc[1],sc[2]); dummy.updateMatrix();
      im.setMatrixAt(i,dummy.matrix);
      if (s.color && p.c) im.setColorAt(i,new THREE.Color(p.c));
    });
    im.castShadow = !!s.shadow; im.receiveShadow = true;
    if (kind==='crystal') veg.crystalIM = im;
    veg.group.add(im);
  }
}

/* ── proximity rings + camp beams ────────────────────────────────────── */
const ringCv = (()=>{ const c=document.createElement('canvas'); c.width=c.height=256;
  const g=c.getContext('2d'), gr=g.createRadialGradient(128,128,30,128,128,126);
  gr.addColorStop(0,'rgba(255,255,255,0)'); gr.addColorStop(0.72,'rgba(255,255,255,0.05)');
  gr.addColorStop(0.9,'rgba(255,255,255,0.5)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,256,256); return new THREE.CanvasTexture(c); })();
const rings = new THREE.Group(); world.add(rings);
let ringMeshes = [];
function buildRings(map){
  rings.clear(); ringMeshes=[];
  const R = (map.proximity ? map.proximity.radius : 3) + 0.5;
  for (const res in map.grounds){
    const [gx,gy] = map.grounds[res];
    const m = new THREE.Mesh(new THREE.PlaneGeometry(R*2,R*2),
      new THREE.MeshBasicMaterial({map:ringCv, color:RES_HEX[res], transparent:true,
        blending:THREE.AdditiveBlending, depthWrite:false, opacity:0.75}));
    m.rotation.x = -Math.PI/2; m.position.set(wx(gx), 0.18, wz(gy));
    rings.add(m); ringMeshes.push(m);
    // beams to camps inside the ring
    for (const p of map.placements||[]){
      if (!p.near) continue;
      const reg=(map.registry||{})[p.name]||{};
      const isCamp = (res==='food'&&p.name==='mill')||(res==='wood'&&p.name==='lumber_camp')||(res==='gold'&&p.name==='mining_camp');
      if (!isCamp) continue;
      const a=new THREE.Vector3(wx(gx),0.22,wz(gy)), b=new THREE.Vector3(wx(p.x),0.22,wz(p.y));
      const len=a.distanceTo(b); if (len<0.01) continue;
      const beam=new THREE.Mesh(new THREE.PlaneGeometry(len,0.14),
        new THREE.MeshBasicMaterial({color:RES_HEX[res],transparent:true,opacity:0.35,
          blending:THREE.AdditiveBlending,depthWrite:false}));
      beam.position.copy(a).lerp(b,0.5);
      beam.rotation.x=-Math.PI/2; beam.rotation.z=Math.atan2(-(b.z-a.z), b.x-a.x);
      beam.rotation.order='ZYX';
      const g2=new THREE.Group(); g2.position.copy(beam.position);
      beam.position.set(0,0,0);
      g2.rotation.y=Math.atan2(-(b.z-a.z), b.x-a.x);
      beam.rotation.set(-Math.PI/2,0,0);
      g2.add(beam); rings.add(g2);
    }
  }
}

/* ── worn footpaths town→grounds (stepping discs) ────────────────────── */
const curves = {};   // res → curve villagers walk
function buildPaths(map){
  const [tx,ty]=map.town;
  const from=new THREE.Vector3(wx(tx),0,wz(ty));
  const discs=[];
  for (const res in map.grounds){
    const [gx,gy]=map.grounds[res];
    const to=new THREE.Vector3(wx(gx),0,wz(gy));
    const mid=from.clone().lerp(to,0.5);
    const perp=new THREE.Vector3(-(to.z-from.z),0,to.x-from.x).normalize()
      .multiplyScalar((thash(gx,gy)-0.5)*4.5);
    curves[res]=new THREE.QuadraticBezierCurve3(from.clone(),mid.add(perp),to.clone());
    const n=Math.ceil(curves[res].getLength()/0.55);
    for (let i=1;i<n;i++){
      const p=curves[res].getPoint(i/n);
      discs.push([p.x+(thash(i,gx)-0.5)*0.16, p.z+(thash(gy,i)-0.5)*0.16, 0.09+thash(i,i)*0.05]);
    }
  }
  const im=new THREE.InstancedMesh(new THREE.CircleGeometry(1,7),
    new THREE.MeshStandardMaterial({color:0x6e532e,roughness:1}), discs.length);
  const d=new THREE.Object3D();
  discs.forEach((p,i)=>{ d.position.set(p[0], tileTop(Math.round(p[0]+MW/2-0.5),Math.round(p[1]+MH/2-0.5))+0.012, p[1]);
    d.rotation.set(-Math.PI/2,0,thash(i,3)*6); d.scale.setScalar(p[2]); d.updateMatrix();
    im.setMatrixAt(i,d.matrix); });

}

function makeBuilding(p, reg){
  const spec = reg[p.name] || {shape:'diamond', color:'#8ab4ff'};
  const rnd = srand((p.id*2654435761)>>>0);
  const cond = p.condition==null?100:p.condition;
  const g = new THREE.Group();
  const top = tileTop(p.x,p.y);
  g.position.set(wx(p.x), top, wz(p.y));
  g.rotation.y = (rnd()*4|0)*Math.PI/2 + (rnd()-0.5)*0.24;
  if (cond<50) g.rotation.z = 0.05+rnd()*0.04;             // leaning, needs repair
  const base = new THREE.Color(spec.color||'#8b5a2b');
  const c = f=>weather(base.clone().multiplyScalar(f), cond);
  const add=(geo,m,s,pos,rot)=>{const o=new THREE.Mesh(geo,m); o.scale.set(...s);
    o.position.set(...pos); if(rot)o.rotation.set(...rot);
    o.castShadow=o.receiveShadow=true; g.add(o); return o;};
  const fp = 0.58+rnd()*0.18, ht = 0.42+rnd()*0.17;        // seeded footprint/height

  if (spec.shape==='house'){
    add(G.box, mat(weather(base.clone().multiplyScalar(1.45).lerp(new THREE.Color(0xd9b078),0.35),cond)),
        [fp,ht,fp*0.92],[0,ht/2,0]);
    const roofC = weather(shade(0xa8522a, 0.75+rnd()*0.5), cond);
    if (rnd()<0.5) add(G.cone4, mat(roofC), [fp*1.0,ht*0.85,fp*0.94],[0,ht+ht*0.42,0],[0,Math.PI/4,0]);
    else { // gable: stretched pyramid

        [0.09,0.1,0.02],[fp*0.18,ht*0.55,fp*0.465],[0,0,0]);              // lit window
    add(G.box, mat(0x241408), [0.12,ht*0.55,0.02],[-fp*0.16,ht*0.28,fp*0.465]); // door
    if (rnd()<0.6) add(G.cyl, mat(0x3a2c18), [0.05,ht*0.5,0.05],[-fp*0.3,ht+ht*0.5,fp*0.1]); // chimney
  }

        [tw,th,tw],[0,th/2,0]);
    add(G.cone8, mat(weather(shade(0x7a3020,1),cond)), [tw*0.82,0.36,tw*0.82],[0,th+0.17,0]);
    add(G.box, mat(0xffcf7a,{emissive:0xffa844,emissiveIntensity:1.8,flatShading:false}),
        [0.08,0.1,0.02],[0,th*0.6,tw*0.68]);
    // LARGE rotating blades on a hub, seeded speed & direction
    const hub=new THREE.Group(); hub.position.set(0,th*0.85,tw*0.85); g.add(hub);
    add(G.cyl, mat(0x3a2c18), [0.045,0.24,0.045],[0,th*0.85,tw*0.72],[Math.PI/2,0,0]);
    const bl=mat(weather(new THREE.Color(0x9a7a4a),cond),{side:THREE.DoubleSide});
    for (let i=0;i<4;i++){
      const b=new THREE.Mesh(G.box, bl); b.scale.set(0.11,0.62,0.02);
      b.position.set(0,0.29,0); const arm=new THREE.Group(); arm.rotation.z=i*Math.PI/2+rnd()*0.05;
      arm.add(b); b.castShadow=true; hub.add(arm);
    }
    mills.push({hub, speed:(0.6+rnd()*1.6)*(rnd()<0.5?-1:1)});
  }
  else if (spec.shape==='camp'){
    const acc = new THREE.Color(spec.accent||'#b5793a');
    // open hut: corner posts + pyramid roof
    for (const [px,pz] of [[-fp/2,-fp/2],[fp/2,-fp/2],[-fp/2,fp/2],[fp/2,fp/2]])
      add(G.cyl, mat(weather(new THREE.Color(0x5c3f20),cond)), [0.045,ht,0.045],[px,ht/2,pz]);

        metalness:0.6,roughness:0.35}),
        [0.11,0.09,0.11],[fp*0.6+(rnd()-0.5)*0.2, 0.05+(i>2?0.12:0), (rnd()-0.5)*0.3]);
    }

  else if (spec.shape==='tech'){
    add(G.box, mat(weather(new THREE.Color(0x5a4a34),cond)), [0.34,0.14,0.34],[0,0.07,0]);

      [0.14,0.2,0.14],[0,0.66,0]);
    g.userData.float = badge;
  }
  else {                                        // unknown/custom → floating faceted gem
    add(G.box, mat(0x4a3a28), [0.3,0.1,0.3],[0,0.05,0]);
    const gem=add(G.oct, mat(base,{emissive:base.clone().multiplyScalar(0.6),
      metalness:0.4,roughness:0.25}), [0.2,0.3,0.2],[0,0.55,0]);
    g.userData.float = gem;
  }
  g.userData.info = {p, spec};
  g.traverse(o=>{o.userData.info=g.userData.info;});
  return g;
}

function syncAgents(agents, anyPending){
  const seen=new Set();
  for (const a of agents){
    seen.add(a.uid);
    let e=agentEnt.get(a.uid);
    const res=(a.task||'').startsWith('gather')?(a.task.split(' ')[1]||'food'):null;
    const herald=a.role==='herald'||a.uid.startsWith('herald');
    if (!e){
      const color=herald?PAL.blue:(RES_HEX[res]||PAL.green);
      const rnd=srand([...a.uid].reduce((s,c)=>s*33+c.charCodeAt(0)>>>0,7)||1);
      e={g:makeFigure(color,herald), herald, off:rnd()*2, lat:(rnd()-0.5)*0.34,
         speed:0.075+rnd()*0.02, idleSpot:rnd()};
      agentsRoot.add(e.g); agentEnt.set(a.uid,e);
    }
    e.res=res; e.status=a.status; e.pending=a.pending;
    seen.add(a.uid);
  }
  for (const [uid,e] of agentEnt) if (!seen.has(uid)){ agentsRoot.remove(e.g); agentEnt.delete(uid); }
  if (beacon){ beacon.visible=anyPending; }
  beaconOn = anyPending;
}
let beaconOn=false;
function animAgents(t){
  for (const [uid,e] of agentEnt){
    const g=e.g;
    if (e.herald){                                   // herald stands by the keep gate
      g.position.set(townPos.x+0.95, townPos.y, townPos.z+0.75);
      g.rotation.y = Math.sin(t*0.4)*0.3-2.2;
      g.position.y += Math.sin(t*1.4)*0.008;
      g.userData.q.visible = !!e.pending;
      if (e.pending) g.userData.q.position.y = 0.85+Math.sin(t*2.4)*0.05;
      continue;
    }
    const curve = curves[e.res];
    if (!curve){ g.visible=false; continue; }
    g.visible=true;
    if (e.status==='running'){                        // WALK the road, carry on return
      const u=(t*e.speed+e.off)%2, out=u<1, k=out?u:2-u;
      const p=curve.getPoint(k), tan=curve.getTangent(k);
      const side=new THREE.Vector3(-tan.z,0,tan.x).multiplyScalar(e.lat);
      const gx=Math.min(MW-1,Math.max(0,Math.round(p.x+MW/2-0.5)));
      const gy=Math.min(MH-1,Math.max(0,Math.round(p.z+MH/2-0.5)));
      g.position.set(p.x+side.x, tileTop(gx,gy)+Math.abs(Math.sin(t*7+e.off*9))*0.05, p.z+side.z);
      g.rotation.y=Math.atan2(out?tan.x:-tan.x, out?tan.z:-tan.z);
      g.rotation.z=Math.sin(t*7+e.off*9)*0.06;
      g.userData.cube.visible=!out;
      g.userData.q.visible=false;
    } else {                                          // idle/awaiting at the ground
      const end=curve.getPoint(1);
      const ang=e.idleSpot*6.28, r=0.5+e.idleSpot*0.4;
      const gx=Math.min(MW-1,Math.max(0,Math.round(end.x+MW/2-0.5)));
      const gy=Math.min(MH-1,Math.max(0,Math.round(end.z+MH/2-0.5)));
      g.position.set(end.x+Math.cos(ang)*r, tileTop(gx,gy), end.z+Math.sin(ang)*r);
      g.rotation.y=ang+Math.PI/2+Math.sin(t*0.8+e.off*7)*0.25;
      g.rotation.z=Math.sin(t*1.3+e.off*5)*0.04;      // slow idle sway
      g.userData.cube.visible=false;
      const wait = e.pending || e.status==='awaiting_approval';
      g.userData.q.visible=wait;
      if (wait) g.userData.q.position.y=0.72+Math.sin(t*2.2+e.off*4)*0.06;
    }
  }
}

/* ── live state polling / scene diff ─────────────────────────────────── */
let inited=false, lastReg={};
async function poll(){
  let d; try { d = await (await fetch('/api/state')).json(); } catch(e){ return; }
  const m=d.map; if (!m) return;
  MW=m.w; MH=m.h; lastReg=m.registry||{}; window.__prox=m.proximity||{pct:15};
  document.getElementById('age').textContent=(d.world.age||'—')+' · turn '+(d.turn??'—');
  for (const r of ['food','wood','gold'])
    document.getElementById('v'+r).textContent=(d.world[r]??0).toLocaleString();
  if (!inited){
    inited=true;
    buildTiles(m.terrain||[]); buildWater(m.terrain||[]);
    buildTown(m); buildPaths(m);
    buildScatter(m.terrain||[], m.placements||[], m.town);
  }
  rebuildVeg(m.terrain||[]);
  buildRings(m);
  // diff placements by id
  const ids=new Set();
  for (const p of m.placements||[]){
    ids.add(p.id);
    const e=built.get(p.id);
    if (!e){ const g=makeBuilding(p,lastReg); buildingsRoot.add(g); built.set(p.id,{g,cond:p.condition}); }
    else if (e.cond!==p.condition){                    // condition moved → rebuild worn look
      buildingsRoot.remove(e.g);
      const idx=mills.findIndex(mm=>e.g.children.includes(mm.hub)||e.g===mm.hub.parent);
      if (idx>=0) mills.splice(idx,1);
      const g=makeBuilding(p,lastReg); buildingsRoot.add(g); built.set(p.id,{g,cond:p.condition});
    }
  }
  for (const [id,e] of built) if (!ids.has(id)){
    buildingsRoot.remove(e.g);
    const idx=mills.findIndex(mm=>e.g===mm.hub.parent);
    if (idx>=0) mills.splice(idx,1);
    built.delete(id);
  }
  const anyPending=(d.agents||[]).some(a=>a.pending);
  syncAgents(d.agents||[], anyPending);
}
poll(); setInterval(poll, 2000);

      +(spec.effect?'<div class="e">'+spec.effect+'</div>':'')
      +'<div>condition '+(p.condition??100)+'%</div>'
      +(p.near?'<div class="g">on its ground’s ring — +'+pr.pct+'% yield</div>':'');
    tip.style.display='block';
    tip.style.left=Math.min(innerWidth-280, ev.clientX+16)+'px';
    tip.style.top=(ev.clientY+14)+'px';
  } else tip.style.display='none';
});
/* ── WASD + QE flythrough ────────────────────────────────────────────── */
const keys={};
addEventListener('keydown',e=>keys[e.code]=true);
addEventListener('keyup',e=>keys[e.code]=false);
function flyStep(dt){
  const sp=(keys.ShiftLeft?14:7)*dt, dir=new THREE.Vector3();
  camera.getWorldDirection(dir); dir.y=0; dir.normalize();
  const right=new THREE.Vector3().crossVectors(dir,new THREE.Vector3(0,1,0));
  const mv=new THREE.Vector3();
  if (keys.KeyW) mv.add(dir); if (keys.KeyS) mv.sub(dir);
  if (keys.KeyD) mv.add(right); if (keys.KeyA) mv.sub(right);
  if (keys.KeyE) mv.y+=1; if (keys.KeyQ) mv.y-=1;
  if (mv.lengthSq()){ mv.normalize().multiplyScalar(sp);
    camera.position.add(mv); controls.target.add(mv); }
}

/* ── animation loop ──────────────────────────────────────────────────── */
const clock=new THREE.Clock();
let tAcc=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.1); tAcc+=dt; const t=tAcc;
  flyStep(dt);
  controls.update();
  animWater(t);
  for (const mm of mills) mm.hub.rotation.z = t*mm.speed;
  for (const c of clouds){ c.position.x += c.userData.v*dt*4;
    if (c.position.x>42) c.position.x=-42; }
  for (const b of birds){ const u=b.userData;
    const a=t*u.sp+u.ph;
    b.position.set(u.cx+Math.cos(a)*u.r, u.h+Math.sin(t*0.9+u.ph)*0.5, u.cz+Math.sin(a)*u.r);
    b.rotation.y=-a-(u.sp>0?Math.PI/2:-Math.PI/2);
    const fl=Math.sin(t*9+u.ph)*0.55;
    u.w1.rotation.z=fl; u.w2.rotation.z=-fl;
  }
  if (motes){ const p=motes.geometry.attributes.position, u=motes.userData;
    for (let i=0;i<p.count;i++){
      p.array[i*3+1]=u.base[i*3+1]+Math.sin(t*0.5+u.seedArr[i])*0.35;
      p.array[i*3]=u.base[i*3]+Math.sin(t*0.22+u.seedArr[i]*2)*0.6;
    } p.needsUpdate=true; }
  for (const m of ringMeshes){ m.material.opacity=0.55+Math.sin(t*1.6)*0.2; m.rotation.z=t*0.05; }
  if (beacon && beacon.visible){
    beacon.material.opacity=0.3+Math.sin(t*3)*0.18;
    beacon.rotation.y=t*0.6;
    beaconLight.intensity=5+Math.sin(t*3)*3.5;
  } else if (beaconLight) beaconLight.intensity=0;
  if (flag) flag.rotation.y=Math.sin(t*2.4)*0.22;
  for (const [,e] of built){ const f=e.g.userData.float;
    if (f){ f.position.y=(f.userData.by??(f.userData.by=f.position.y))+Math.sin(t*1.8+e.g.position.x)*0.05;
      f.rotation.y=t*0.8; } }
  if (veg.crystalIM) veg.crystalIM.material.emissiveIntensity=0.6+Math.sin(t*2.1)*0.35+Math.sin(t*5.7)*0.12;
  animAgents(t);
  renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script></body></html>
