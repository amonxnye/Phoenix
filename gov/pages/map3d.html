<style>
  :root{--ink:#f2ead8;--dim:#b7a884;--gold:#e6b93e;--glass:rgba(22,17,11,.62);--line:rgba(255,255,255,.12)}

  @keyframes sp{to{transform:rotate(360deg)}}

  @media (max-width:640px){#panel{width:auto;left:14px;top:auto;bottom:44px}#hud{min-width:0}}
</style>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {Water} from 'three/addons/objects/Water.js';
import {makeTextures} from '/pages/gfx/util.js';
import {createSky} from '/pages/gfx/sky.js';
import {buildCurves, makeField, buildTerrain, WATER_Y} from '/pages/gfx/terrain.js';
import {WIND, buildScenery, LiveNature, maskGrass} from '/pages/gfx/nature.js';
import {makeKit, waveBanners} from '/pages/gfx/kit.js';
import {makeBuilding, makeKeep} from '/pages/gfx/buildings.js';
import {Fx, Wildlife} from '/pages/gfx/fx.js';
import {Agents, Flock} from '/pages/gfx/agents.js';
import {Post, TIERS} from '/pages/gfx/post.js';

const $ = id => document.getElementById(id), q = new URLSearchParams(location.search);
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };

/* ── renderer, scene, camera ─────────────────────────────────────────────────────── */
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0xb4cadb, 0.007);
const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.15, 9000);
camera.position.set(8.4, 5.2, 12.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.9, 0.5, -1.0); controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.maxPolarAngle = Math.PI*0.495; controls.minDistance = 1.5; controls.maxDistance = 60;
if (q.get('cam')) { const c = q.get('cam').split(',').map(Number); camera.position.set(c[0],c[1],c[2]); controls.target.set(c[3],c[4],c[5]); controls.update(); }
const post = new Post(renderer, scene, camera);

/* ── state ───────────────────────────────────────────────────────────────────────── */
let W = null;                         // everything built from the map, once we have it
let tierName = q.get('q') || store.get('phoenix3d_q') || 'auto', autoTier = tierName === 'auto', sceneryLevel = -1;
const LEVEL = {low:0, medium:1, high:2};
let inited = false, keepLevel = -1, lastAge = -1;
const built = new Map(), mills = [];

async function fetchState(){ try{ const r = await fetch('/api/state'); return await r.json(); }catch(e){ return null; } }

/* ── building the world (once the map arrives) ───────────────────────────────────── */
function buildWorld(map){
  const T = makeTextures(), curves = buildCurves(map), field = makeField(map, curves);
  const sky = createSky(scene, renderer, {shadowHalf: Math.hypot(map.w, map.h)/2 + 3});
  if (q.get('tod')) { sky.state.tod = +q.get('tod'); sky.state.auto = false; }
  const terrain = buildTerrain(field, T, 1); scene.add(terrain);
  const water = new Water(new THREE.PlaneGeometry(3000,3000), {textureWidth:512, textureHeight:512, waterNormals:T.water,
    sunDirection:new THREE.Vector3(), sunColor:0xffffff, waterColor:0x0d3f4d, distortionScale:2.4, size:0.16, fog:true, alpha:0.8});
  // deeper, bluer reflections: the stock shader mirrors the pale sky at full strength
  water.material.fragmentShader = water.material.fragmentShader.replace('vec3( 0.1 ) + reflectionSample * 0.9 + reflectionSample * specularLight', 'vec3(0.03, 0.07, 0.08) + reflectionSample * vec3(0.5, 0.68, 0.78) + reflectionSample * specularLight');
  water.rotation.x = -Math.PI/2; water.position.y = WATER_Y; water.userData.noAO = true; scene.add(water);
  const lite = new THREE.Mesh(new THREE.PlaneGeometry(3000,3000), new THREE.MeshStandardMaterial({color:0x1f6a7c, roughness:0.08, metalness:0.2, transparent:true, opacity:0.9, normalMap:T.water, normalScale:new THREE.Vector2(0.4,0.4)}));
  lite.rotation.x = -Math.PI/2; lite.position.y = WATER_Y; lite.visible = false; lite.userData.noAO = true; scene.add(lite);
  const kit = makeKit(T), fx = new Fx(scene, renderer, camera), wildlife = new Wildlife(scene, field, 2);
  const agents = new Agents(scene, kit, field, fx); agents.setCurves(curves); agents.setTown(field.town);
  const flock = new Flock(scene, kit, field, 6);
  const buildingsRoot = new THREE.Group(); scene.add(buildingsRoot);
  const live = new LiveNature(field, T, 2); scene.add(live.group);
  const ctx = {field, kit, fx, mills, trees:null, foliage:null};
  W = {map, T, curves, field, sky, terrain, water, lite, kit, fx, wildlife, agents, flock, buildingsRoot, live, ctx, scenery:null, keep:null};
  window.__world = W;
}
function ensureScenery(level){
  if (!W || sceneryLevel === level) return;
  if (W.scenery){ scene.remove(W.scenery); W.scenery.traverse(o=>{ o.geometry?.dispose?.(); }); }
  W.scenery = buildScenery(W.field, W.T, level); scene.add(W.scenery); sceneryLevel = level;
  W.ctx.trees = W.scenery.userData.trees; W.ctx.foliage = W.scenery.userData.foliage;
  applyGrass(); maskGround();
}
function applyGrass(){ if (W?.scenery) W.scenery.userData.setGrassDensity(TIERS[curTier()].grass); }
const curTier = () => (autoTier ? autoState.tier : tierName);

/* ── quality ─────────────────────────────────────────────────────────────────────── */
const autoState = {tier:'medium', acc:0, n:0, up:0, hold:0};
function applyTier(name){
  const cfg = TIERS[name]; post.set(name);
  if (W){
    const sun = W.sky.sun; if (sun.shadow.mapSize.x !== cfg.shadow){ sun.shadow.map?.dispose(); sun.shadow.map = null; sun.shadow.mapSize.set(cfg.shadow, cfg.shadow); }
    W.water.visible = cfg.reflect > 0; W.lite.visible = cfg.reflect === 0;
    ensureScenery(LEVEL[name]); applyGrass();
  }
  $('fps').textContent = TIERS[name].name;
}
function autoQuality(dt){
  if (!autoTier || autoState.hold > 0){ autoState.hold -= dt; return; }
  autoState.acc += dt; autoState.n++;
  if (autoState.n < 90) return;
  const avg = autoState.acc/autoState.n; autoState.acc = 0; autoState.n = 0;
  const order = ['low','medium','high'], i = order.indexOf(autoState.tier);
  if (avg > 1/26 && i > 0){ autoState.tier = order[i-1]; autoState.up = 0; autoState.hold = 4; applyTier(autoState.tier); }
  else if (avg < 1/56 && i < 2){ if (++autoState.up >= 3){ autoState.tier = order[i+1]; autoState.up = 0; autoState.hold = 8; applyTier(autoState.tier); } }
  else autoState.up = 0;
}

/* ── live data → scene ───────────────────────────────────────────────────────────── */
function maskGround(){
  if (!W?.scenery || !W.map) return;
  const F = W.field, discs = [[F.town.x, F.town.z, 2.3]];
  for (const p of W.map.placements||[]){
    const spec = (W.map.registry||{})[p.name]||{}, civic = !['house','mill','camp','tech','diamond'].includes(spec.shape);
    discs.push([F.wx(p.x), F.wz(p.y), civic ? 0.8*(spec.scale||1) : 0.55]);
  }
  maskGrass(W.scenery.userData.blades, discs);
  W.flock.setAvoid([...discs.map(d=>[d[0], d[1], d[2]+0.4]), ...F.water.map(w=>[w[0], w[1], 1.7])]);
}
function disposeEntry(e){
  W.buildingsRoot.remove(e.g); W.fx.removeOwner(e.id);
  for (let i = mills.length-1; i >= 0; i--) if (e.g.getObjectById(mills[i].hub.id)) mills.splice(i,1);
  e.g.traverse(o=>{ if (o.isPointLight){ const k = W.kit.lights; k.list.splice(k.list.indexOf(o),1); k.budget++; } });
  const bi = W.kit.banners; for (let i = bi.length-1; i >= 0; i--) if (e.g.getObjectById(bi[i].id)) bi.splice(i,1);
}
function ageIndex(m){ return m.age_index || 0; }
/* ?demo=1 — inject one of every civic shape and a few extra homes, for visual review only */
function demoInject(m){
  if (m.__demo) return; m.__demo = true; m.registry = m.registry || {}; m.placements = m.placements || [];
  const shapes = ['plaza','garden','fountain','tower','temple','monument','lamp','grove','aqueduct','library','wall','road'];
  const cols = ['#c9b98f','#e07a9a','#7ac8e0','#b8a070','#e8dcc0','#e0b23a','#ffc870','#5aa05a','#bfb39a','#9ab0d0','#9a8e7a','#8a7a66'];
  shapes.forEach((sh,i)=>{ const name = 'demo_'+sh; m.registry[name] = {shape:sh, color:cols[i], scale:1, layer:2, effect:'demo '+sh};
    m.placements.push({id:9000+i, name, x:1+(i%6)*4, y:i<6?12:14, condition:100+0, near:false}); });
  m.registry.demo_gem = {shape:'diamond', color:'#8ab4ff', layer:2}; m.placements.push({id:9100, name:'demo_gem', x:22, y:12, condition:100});
  for (let i=0;i<4;i++) m.placements.push({id:9200+i, name:'house', x:4+i*2, y:2, condition:[100,80,55,30][i]});
}
function applyState(d){
  const m = d.map; if (!m) return;
  if (q.get('demo')) demoInject(m);
  W.map = m; const reg = m.registry || {};
  $('age').textContent = (d.world.age||'—')+' · turn '+(d.turn??'—');
  for (const r of ['food','wood','gold']) $('v'+r).textContent = (d.world[r]??0).toLocaleString();
  W.live.sync(m.terrain||[]);
  // the keep grows with the age
  const lvl = Math.min(4, Math.floor(ageIndex(m)/2));
  if (keepLevel !== lvl){
    if (W.keep){ scene.remove(W.keep); W.fx.removeOwner('keep'); W.keep.traverse(o=>{ if (o.isPointLight){ const k=W.kit.lights; k.list.splice(k.list.indexOf(o),1); k.budget++; } });
      const bi = W.kit.banners; for (let i = bi.length-1; i >= 0; i--) if (W.keep.getObjectById(bi[i].id)) bi.splice(i,1); }
    W.keep = makeKeep(W.ctx, m, ageIndex(m)); W.keep.scale.setScalar(1 + 0.04*ageIndex(m)); scene.add(W.keep); keepLevel = lvl;
    if (lastAge >= 0) W.fx.burst(W.field.town.x, W.field.town.y+2, W.field.town.z, 0xffd766, 40);
  } else if (W.keep) W.keep.scale.setScalar(1 + 0.04*ageIndex(m));
  lastAge = ageIndex(m);
  // diff placements by id
  const ids = new Set(); let changed = false;
  const make = p => { const g = makeBuilding(p, reg, W.ctx); if ((reg[p.name]||{}).shape==='house') g.scale.setScalar(1.22); W.buildingsRoot.add(g);
    const anim = []; g.traverse(o=>{ if (o.userData.orbit !== undefined || o.userData.spin) anim.push(o); });
    built.set(p.id, {g, cond:p.condition, id:p.id, anim}); return g; };
  for (const p of m.placements||[]){
    ids.add(p.id); const e = built.get(p.id);
    if (!e){ const g = make(p); changed = true; if (inited) W.fx.burst(g.position.x, g.position.y+0.5, g.position.z, 0xffe08a, 22); }
    else if (e.cond !== p.condition){ disposeEntry(e); make(p); }
  }
  for (const [id,e] of built) if (!ids.has(id)){ disposeEntry(e); built.delete(id); changed = true; }
  if (changed || !inited) maskGround();
  const civ = m.utopia; if (civ) $('pill').textContent = 'utopia '+civ.index+' · '+civ.works+' civic works'; else $('pill').style.display='none';
  if (q.get('walk')) for (const a of d.agents||[]) { a.status = 'running'; a.pending = null; }     // review-only: watch them walk
  W.agents.sync(d.agents||[]);
  inited = true;
}
async function poll(){ const d = await fetchState(); if (d && W) applyState(d); }

/* ── pointer picking → tooltip ───────────────────────────────────────────────────── */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = $('tip');
addEventListener('pointermove', ev => {
  if (!W) return;
  mouse.set(ev.clientX/innerWidth*2-1, -(ev.clientY/innerHeight)*2+1); ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects([W.buildingsRoot, W.agents.root, ...(W.keep?[W.keep]:[])], true).find(h=>h.object.visible && !h.object.isSprite);
  const o = hit?.object, a = o?.userData.agent, info = o?.userData.info;
  if (a){
    tip.innerHTML = '<div class="n">'+a.uid+'</div><div class="e">'+(a.role||'villager')+(a.task?' · '+a.task:'')+'</div><div>'+a.status+'</div>'+(a.pending?'<div class="w">waiting on a human decision</div>':'');
  } else if (info){
    const {p, spec} = info, pr = window.__prox||{pct:15};
    tip.innerHTML = '<div class="n">'+p.name.replace(/_/g,' ')+'</div>'+(spec.effect?'<div class="e">'+spec.effect+'</div>':'')+'<div>condition '+(p.condition??100)+'%</div>'+(p.near?'<div class="g">on its ground’s ring — +'+pr.pct+'% yield</div>':'');
  } else if (o?.userData.keep){ tip.innerHTML = '<div class="n">the keep</div><div class="e">seat of the settlement — grows with each age</div>'; }
  else { tip.style.display = 'none'; return; }
  tip.style.display = 'block'; tip.style.left = Math.min(innerWidth-290, ev.clientX+16)+'px'; tip.style.top = (ev.clientY+14)+'px';
});

/* ── controls: fly, cinematic, time, quality, photo ──────────────────────────────── */
const keys = {}; addEventListener('keydown', e=>{ keys[e.code] = true;
  if (e.code === 'KeyC') toggleCine(); if (e.code === 'KeyH') togglePhoto(); if (e.code === 'F2'){ e.preventDefault(); wantShot = true; } });
addEventListener('keyup', e=>keys[e.code] = false);
let cine = false, camAngle = 0, wantShot = false;
function toggleCine(){ cine = !cine; $('cine').classList.toggle('on', cine); if (cine) camAngle = Math.atan2(camera.position.x-controls.target.x, camera.position.z-controls.target.z); }
controls.addEventListener('start', ()=>{ if (cine) toggleCine(); });
function togglePhoto(){ document.body.classList.toggle('photo'); }
$('cine').onclick = toggleCine; $('photo').onclick = togglePhoto; $('snap').onclick = ()=>{ wantShot = true; };
$('qual').value = tierName; $('qual').onchange = e => { tierName = e.target.value; autoTier = tierName === 'auto'; store.set('phoenix3d_q', tierName); applyTier(autoTier ? autoState.tier : tierName); };
$('tod').oninput = e => { if (!W) return; W.sky.state.auto = false; W.sky.state.tod = +e.target.value; mark(null); };
function mark(t){ document.querySelectorAll('#presets button').forEach(b=>b.classList.toggle('on', b.dataset.t === t)); }
document.querySelectorAll('#presets button').forEach(b => b.onclick = () => { if (!W) return;
  if (b.dataset.t === 'auto'){ W.sky.state.auto = true; } else { W.sky.state.auto = false; W.sky.state.tod = +b.dataset.t; $('tod').value = b.dataset.t; }
  mark(b.dataset.t); W.sky.forceEnv(); });
function flyStep(dt){
  const sp = (keys.ShiftLeft?14:7)*dt, dir = new THREE.Vector3(); camera.getWorldDirection(dir); dir.y = 0; dir.normalize();
  const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0)), mv = new THREE.Vector3();
  if (keys.KeyW) mv.add(dir); if (keys.KeyS) mv.sub(dir); if (keys.KeyD) mv.add(right); if (keys.KeyA) mv.sub(right);
  if (keys.KeyE) mv.y += 1; if (keys.KeyQ) mv.y -= 1;
  if (mv.lengthSq()){ mv.normalize().multiplyScalar(sp); camera.position.add(mv); controls.target.add(mv); }
}
const fmtClock = t => { const h = t*24, hh = Math.floor(h)%24, mm = Math.floor((h-Math.floor(h))*60); return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0'); };

/* ── the loop ────────────────────────────────────────────────────────────────────── */
const clock = new THREE.Clock(); let tAcc = 0, frames = 0, tFps = performance.now();
const STILL = q.get('still') ? +q.get('still') : 0; let stillN = 0;
function frame(){
  if (!STILL || stillN < STILL) requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.1); tAcc += dt; const t = tAcc;
  if (!W) return;
  flyStep(dt);
  if (cine){ camAngle += dt*0.07; const r = 15 + Math.sin(t*0.05)*2, h = 3.2 + Math.sin(t*0.11)*1.1;
    camera.position.set(controls.target.x + Math.sin(camAngle)*r, h + W.field.heightAt(controls.target.x, controls.target.z), controls.target.z + Math.cos(camAngle)*r); }
  controls.update();
  const gy = W.field.heightAt(camera.position.x, camera.position.z); if (camera.position.y < gy + 0.45) camera.position.y = gy + 0.45;
  WIND.value += dt;
  const s = W.sky.apply(dt, camera); renderer.toneMappingExposure = s.exposure;
  W.water.material.uniforms.time.value += dt*0.55; W.water.material.uniforms.sunDirection.value.copy(s.sunDir); W.water.material.uniforms.sunColor.value.copy(s.sunColor);
  W.water.material.uniforms.waterColor.value.setRGB(0.05, 0.25, 0.3).multiplyScalar(0.25 + 0.75*s.day);
  W.kit.setNight(s.night, s.dusk); waveBanners(W.kit, t);
  for (const l of W.kit.lights.list) l.intensity = (l.userData.base||1) * (0.15 + 1.6*Math.max(s.night, s.dusk*0.6)) * (0.88 + 0.12*Math.sin(t*13 + l.position.x*9) + 0.05*Math.sin(t*31));
  for (const mm of mills) mm.hub.rotation.z = t*mm.speed;
  W.live.update(t); W.fx.update(dt, t, s);
  W.wildlife.update(dt, t, s, camera, renderer.domElement.height*0.5/Math.tan(THREE.MathUtils.degToRad(camera.fov)/2));
  W.agents.update(t, dt); W.flock.update(t, dt);
  for (const [,e] of built){ const f = e.g.userData.float; if (f){ f.userData.by ??= f.position.y; f.position.y = f.userData.by + Math.sin(t*1.8 + e.g.position.x)*0.04; f.rotation.y = t*0.8; }
    for (const o of e.anim){ if (o.userData.orbit !== undefined){ const a = t*0.9 + o.userData.orbit*2.1; o.position.x = Math.cos(a)*0.26; o.position.z = Math.sin(a)*0.26; } if (o.userData.spin) o.rotation.z = t*0.5; } }
  if (W.keep){ const u = W.keep.userData, on = W.agents.beaconOn; u.beacon.visible = on;
    if (on){ u.beacon.material.opacity = 0.13 + Math.sin(t*3)*0.06; u.beacon.rotation.y = t*0.6; u.beaconLight.intensity = 6 + Math.sin(t*3)*4; } else u.beaconLight.intensity = 0; }
  post.mood(s); post.render(dt, t);
  if (wantShot){ wantShot = false; renderer.domElement.toBlob(b=>{ const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'phoenix-'+Date.now()+'.png'; a.click(); }); }
  autoQuality(dt);
  $('clock').textContent = fmtClock(s.tod)+' · '+s.phase; if (!$('tod').matches(':active')) $('tod').value = s.tod;
  if (++frames % 30 === 0){ const now = performance.now(), f = Math.round(30000/(now-tFps)); tFps = now; window.__fps = f; $('fps').textContent = TIERS[curTier()].name+' · '+f+' fps'; }
  if (STILL && ++stillN >= STILL){ window.__info = renderer.info.render; window.__done = true; }
}

/* ── boot ────────────────────────────────────────────────────────────────────────── */
addEventListener('resize', ()=>{ camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); post.resize(innerWidth, innerHeight); });
(async function boot(){
  let d = null; while (!d || !d.map){ d = await fetchState(); if (!d || !d.map) await new Promise(r=>setTimeout(r,1000)); }
  buildWorld(d.map); window.__prox = d.map.proximity || {pct:15};
  const tier = autoTier ? autoState.tier : tierName; ensureScenery(LEVEL[tier]); applyTier(tier);
  applyState(d); W.sky.forceEnv();
  $('boot').style.opacity = 0; setTimeout(()=>$('boot').remove(), 1000);
  frame(); if (!STILL) setInterval(poll, 2000);
})();
