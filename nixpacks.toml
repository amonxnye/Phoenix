# git is a runtime dependency, not a build-time one.
#
# The Builder's whole safety model is "everything an agent does is a branch": every
# attempt runs in a `git worktree`, and rejecting costs a deleted branch. A guest's
# starter workspace is a real repository built with `git init`. So an image without
# git does not degrade the service — it removes the only undo it has.
#
# The Python builder installs git for the build phase and drops it from the runtime
# image, which is why this file exists. "..." keeps the defaults and appends.
[phases.setup]
nixPkgs = ["...", "git"]
